[project]
name = "butlet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "mcp[cli]>=2.1.1",
    "mlxtend>=0.25.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyjwt>=2.13.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "razorpay>=2.0.1",
]



[project.scripts]
mcp-simple-auth-rs = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = ["pyright>=1.1.391", "pytest>=8.3.4", "ruff>=0.8.5"]